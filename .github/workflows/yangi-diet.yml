# YANGI DIET (C# / .NET) — o'rnatuvchini yig'ib GitLab Package Registry'ga qo'yish.
#
# Flutter DIET'ning build.yml iga va uning «latest» Release'iga TEGMAYDI:
# GitHub Release yaratmaydi, Flutter kassalar hech narsa ko'rmaydi.
# C# ilova o'zi GitLab Package Registry'dan yangilanadi
# (diet-pos/latest/latest.json, loyiha j.xamroyev/diet-aiba-pos).
#
# Kod yopiq GitLab'da, `yangi-diet` shoxida. Har 15 daqiqada shoxdagi
# Directory.Build.props <Version> Registry'dagi chiqarilgan versiya bilan
# solishtiriladi. Yangisi KATTA bo'lsa: Windows mashinada build + 1495 test +
# o'rnatuvchi, keyin tools/ci-release.ps1 uni Registry'ga qo'yadi va kassa
# ko'zi bilan (tokensiz) qayta tekshiradi. Test qizil bo'lsa — chiqmaydi.
# YANGILANISH CHIQARISH = GitLab'da `yangi-diet` ga versiyasi oshirilgan MR.
#
# SECRET'LAR (Settings -> Secrets and variables -> Actions -> Secrets):
#   GITLAB_USER, GITLAB_TOKEN — mavjud (build.yml bilan umumiy), kodni o'qish.
#   GITLAB_PKG_TOKEN — YANGI: GitLab loyiha kaliti, paketni YOZISH uchun.
#     gitlab.aiba.uz -> diet-aiba-pos -> Settings -> Access tokens -> Add new
#     token: nomi `github-yangi-diet`, role Developer, scope `api`, muddat.
#
# XAVFSIZLIK (build.yml bilan bir xil qoidalar):
#  * Triggerlar faqat schedule va qo'lda: pull request / fork secret'larga
#    yeta olmaydi.
#  * GitHub ruxsatlari YO'Q (`permissions: {}`): bu workflow GitHub'ga hech
#    narsa yozmaydi.
#  * Uchinchi tomon action ishlatilmaydi.
#  * GitLab kaliti klon URL'ida emas, vaqtinchalik HTTP sarlavhada; log'da
#    yashirinadi; `.git/config` ga yozilmaydi.

name: Yangi DIET (C#)

on:
  schedule:
    # build.yml (*/15) bilan bir daqiqaga tushmasin.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "GitLab shoxi (odatda yangi-diet)"
        default: yangi-diet
      force:
        description: "Versiya chiqarilgan bo'lsa ham qayta yig'ib qo'yilsin"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: yangi-diet
  cancel-in-progress: false

env:
  GITLAB_HOST: gitlab.aiba.uz
  GITLAB_PATH: ${{ vars.YANGI_DIET_GITLAB_PATH || 'j.xamroyev/diet-aiba-pos.git' }}
  PACKAGE: diet-pos

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
      ver: ${{ steps.cmp.outputs.ver }}
    steps:
      - id: cmp
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          REF: ${{ github.event.inputs.ref || 'yangi-diet' }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "$GL_USER" ] || [ -z "$GL_TOKEN" ]; then
            echo "::error::GITLAB_USER / GITLAB_TOKEN secret qo'yilmagan (SOZLASH.md)"
            exit 1
          fi
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::noto'g'ri ref"; exit 1; }
          AUTH=$(printf '%s:%s' "$GL_USER" "$GL_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"

          # Shoxning oxirgi commit'i va undagi versiya — faqat git orqali
          # (read_repository yetadi, API huquqi shart emas).
          git init -q src
          git -C src -c "http.extraHeader=Authorization: Basic $AUTH" \
            fetch -q --depth 1 "https://$GITLAB_HOST/$GITLAB_PATH" "refs/heads/$REF" \
            || { echo "::error::GitLab'da $REF topilmadi yoki kirish rad etildi"; exit 1; }
          SHA=$(git -C src rev-parse FETCH_HEAD)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::noto'g'ri SHA"; exit 1; }
          PROPS=$(git -C src show "$SHA:Directory.Build.props")
          VER=$(printf '%s' "$PROPS" | grep -oE '<Version>[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -n "$VER" ] || { echo "::error::Directory.Build.props: <Version> topilmadi"; exit 1; }

          # Kassalar ko'radigan manifest — TOKENSIZ (kassa ko'zi bilan).
          PROJ="${GITLAB_PATH%.git}"; PROJ="${PROJ//\//%2F}"
          CODE=$(curl -sS -m 30 -o pub.json -w '%{http_code}' \
            "https://$GITLAB_HOST/api/v4/projects/$PROJ/packages/generic/$PACKAGE/latest/latest.json" || true)
          PUB=""
          if [ "$CODE" = "200" ]; then PUB=$(jq -r '.version // empty' pub.json); fi
          echo "$REF = $SHA, versiya $VER; chiqarilgan: ${PUB:-yoq} (HTTP $CODE)"

          CH=false
          if [ -z "$PUB" ]; then
            CH=true
          elif [ "$VER" != "$PUB" ] && [ "$(printf '%s\n%s\n' "$PUB" "$VER" | sort -V | tail -1)" = "$VER" ]; then
            CH=true
          elif [ "$VER" != "$PUB" ]; then
            echo "::warning::Shoxdagi versiya ($VER) chiqarilganidan ($PUB) kichik — yig'ilmaydi."
          fi
          [ "$FORCE" = "true" ] && CH=true
          echo "changed=$CH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"    >> "$GITHUB_OUTPUT"
          echo "ver=$VER"    >> "$GITHUB_OUTPUT"
          [ "$CH" = true ] && echo "Yangi versiya: build ketadi." || echo "Yangilik yo'q."

  windows:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    permissions: {}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Kodni GitLab'dan olish (aniq commit)
        shell: bash
        env:
          GL_USER: ${{ secrets.GITLAB_USER }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::noto'g'ri SHA"; exit 1; }
          AUTH=$(printf '%s:%s' "$GL_USER" "$GL_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git init -q src
          git -C src -c "http.extraHeader=Authorization: Basic $AUTH" \
            fetch -q --depth 1 "https://$GITLAB_HOST/$GITLAB_PATH" "$SHA"
          git -C src checkout -q FETCH_HEAD
          echo "Commit: $(git -C src log -1 --format='%h %s')"

      # Kassa Toshkent vaqtida ishlaydi; testlar ham shu soat mintaqasida
      # (kun chegarasi, chek raqami) — runner'ning UTC si emas.
      - name: Soat mintaqasi (Toshkent)
        run: tzutil /s "West Asia Standard Time"; tzutil /g

      - name: .NET 9 SDK
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "dotnet"
          $inst = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile $inst
          & $inst -Channel 9.0 -InstallDir $dir
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "$dir\dotnet.exe" --version

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        working-directory: src
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet build DietPos.sln -c Release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::dotnet build yiqildi"; exit 1 }

      - name: Testlar
        working-directory: src
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet test tests\DietPos.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::testlar yiqildi - reliz chiqmaydi"; exit 1 }

      # O'rnatuvchi + GitLab Package Registry + tokensiz tekshiruv — GitLab
      # quvuridagi bilan BIR XIL skript (Windows PowerShell 5.1, faqat ASCII).
      - name: O'rnatuvchi va reliz (GitLab Package Registry)
        working-directory: src
        env:
          GITLAB_PKG_TOKEN: ${{ secrets.GITLAB_PKG_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          FORCE: ${{ github.event.inputs.force }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          if (-not $env:GITLAB_PKG_TOKEN) {
            Write-Host "::error::GITLAB_PKG_TOKEN secret yo'q - o'rnatuvchi yig'ildi, lekin GitLab'ga qo'yib bo'lmaydi (yangi-diet.yml boshidagi izoh)"
            exit 1
          }
          $path = $env:GITLAB_PATH -replace '\.git$', ''
          $env:CI_API_V4_URL = "https://$env:GITLAB_HOST/api/v4"
          $env:CI_PROJECT_PATH = $path
          $env:CI_PROJECT_ID = [uri]::EscapeDataString($path)
          $env:CI_COMMIT_SHA = $env:SHA
          if ($env:FORCE -eq "true") { $env:FORCE_REBUILD = "1" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-release.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ci-release.ps1 yiqildi (log'ga qarang)"; exit 1 }
